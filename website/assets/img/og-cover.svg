<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="LifeLog — Your life doesn't need AI. It needs a memory.">
  <defs>
    <linearGradient id="aura" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f4e4b" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#1f4e4b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#f4fbf7"/>
  <ellipse cx="600" cy="40" rx="520" ry="260" fill="url(#aura)"/>

  <!-- brand -->
  <rect x="72" y="64" width="44" height="44" rx="11" fill="#1f4e4b"/>
  <path d="M86 75h5v18h11v5H86z" fill="#ffffff"/>
  <text x="130" y="95" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="25" font-weight="600" fill="#161d1b">LifeLog</text>

  <!-- headline -->
  <text x="72" y="248" font-family="'Iowan Old Style', Charter, Palatino, Georgia, serif" font-size="68" fill="#161d1b">Your life doesn&#8217;t need <tspan font-style="italic">AI.</tspan></text>
  <text x="72" y="330" font-family="'Iowan Old Style', Charter, Palatino, Georgia, serif" font-size="68" fill="#1f4e4b">It needs a memory.</text>

  <!-- subcopy -->
  <text x="72" y="394" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="25" fill="#404847">One quiet place for what you spent, where your time went,</text>
  <text x="72" y="430" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="25" fill="#404847">what you did, and the moments worth remembering.</text>

  <!-- sample entries -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">
    <rect x="72" y="472" width="470" height="48" rx="12" fill="#ffffff" stroke="#e3ece7"/>
    <circle cx="96" cy="496" r="5" fill="#b0452c"/>
    <text x="114" y="503" fill="#161d1b" font-family="system-ui, -apple-system, sans-serif">lunch with team</text>
    <text x="470" y="503" fill="#b0452c" text-anchor="start">&#8377;350</text>

    <rect x="562" y="472" width="470" height="48" rx="12" fill="#ffffff" stroke="#e3ece7"/>
    <circle cx="586" cy="496" r="5" fill="#136b60"/>
    <text x="604" y="503" fill="#161d1b" font-family="system-ui, -apple-system, sans-serif">deep work</text>
    <text x="938" y="503" fill="#136b60">2h 15m</text>
  </g>

  <!-- value row -->
  <text x="72" y="572" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="500" fill="#5a6560">No AI  ·  No ads  ·  No streaks  ·  No noise  ·  Android &amp; web</text>
</svg>
