<!--
  Paste into Supabase → Authentication → Emails → Magic Link.

  Paste it into **Confirm signup** as well. signInWithOtp uses Magic Link for an
  existing user but Confirm signup for one that does not exist yet, so a fresh
  account otherwise receives a codeless email and cannot get in. Each template
  has its own Save button.

  {{ .Token }} is the load-bearing part: without it the email carries no code,
  and an installed iOS PWA can never be signed in, because a link tapped in Mail
  opens in Safari and the PWA has its own storage.

  Kept in the repo because a template that only exists in a dashboard field is a
  template nobody can review or restore.
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Without these, iOS Mail in dark mode inverts the card on its own terms
         and the code box can end up unreadable. -->
    <meta name="color-scheme" content="light dark" />
    <meta name="supported-color-schemes" content="light dark" />
    <title>Your lifelog sign-in code</title>
    <style>
      /* Inline styles beat a media query, so the dark overrides need !important. */
      @media (prefers-color-scheme: dark) {
        .wrap {
          background: #0d1220 !important;
        }
        .card {
          background: #161d2f !important;
          border-color: #212940 !important;
        }
        .ink {
          color: #e8eaf0 !important;
        }
        .muted {
          color: #a3abba !important;
        }
        .otp {
          background: #0d1220 !important;
          border-color: #39425a !important;
        }
        .btn {
          background: #e8eaf0 !important;
          color: #0d1220 !important;
        }
        .rule {
          border-color: #212940 !important;
        }
      }
    </style>
  </head>

  <body
    class="wrap"
    style="margin: 0; padding: 0; background: #f6f7f9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #111827"
  >
    <!-- Preheader: puts the code in the inbox preview and the phone's
         notification, so it can be read without opening anything. Delete this
         block if you would rather it not appear on a lock screen. -->
    <div
      style="display: none; max-height: 0; overflow: hidden; mso-hide: all"
      aria-hidden="true"
    >
      Your lifelog code is {{ .Token }}
    </div>

    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      class="wrap"
      style="background: #f6f7f9; padding: 40px 16px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            border="0"
            class="card"
            style="max-width: 480px; background: #ffffff; border: 1px solid #e9ebef; border-radius: 16px; overflow: hidden"
          >
            <tr>
              <td style="padding: 32px 32px 24px; text-align: center">
                <div class="ink" style="font-size: 22px; font-weight: 700; letter-spacing: -0.4px; color: #111827">
                  lifelog
                </div>
              </td>
            </tr>

            <tr>
              <td style="padding: 8px 32px 36px; text-align: center">
                <h1
                  class="ink"
                  style="margin: 0 0 12px; font-size: 22px; line-height: 30px; font-weight: 650; letter-spacing: -0.3px; color: #111827"
                >
                  Sign in to lifelog
                </h1>

                <p class="muted" style="margin: 0 0 28px; font-size: 15px; line-height: 24px; color: #5b6472">
                  Enter this code in the app.
                </p>

                <div
                  class="otp"
                  style="display: inline-block; padding: 16px 24px; margin-bottom: 24px; background: #f6f7f9; border: 1px solid #e9ebef; border-radius: 12px"
                >
                  <!-- The negative right margin cancels the trailing letter-spacing,
                       which would otherwise push the digits off centre. -->
                  <span class="ink" style="font-size: 30px; line-height: 38px; font-weight: 700; letter-spacing: 8px; margin-right: -8px; color: #111827">{{ .Token }}</span>
                </div>

                <p class="muted" style="margin: 0 0 20px; font-size: 14px; line-height: 22px; color: #5b6472">
                  On this device you can use the link instead:
                </p>

                <a
                  href="{{ .ConfirmationURL }}"
                  class="btn"
                  style="display: inline-block; padding: 12px 24px; background: #111827; color: #ffffff; text-decoration: none; border-radius: 10px; font-size: 14px; font-weight: 600"
                >
                  Open lifelog
                </a>

                <p class="muted" style="margin: 28px 0 0; font-size: 13px; line-height: 20px; color: #8b93a1">
                  The code and the link each work once, and expire in an hour.
                </p>
              </td>
            </tr>

            <tr>
              <td class="rule" style="padding: 20px 32px; border-top: 1px solid #e9ebef; text-align: center">
                <p class="muted" style="margin: 0; font-size: 12px; line-height: 18px; color: #8b93a1">
                  If you did not request this, ignore it. Nothing has changed.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
