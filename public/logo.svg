<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="512" height="512" role="img" aria-label="lifelog">
  <!--
    The mark is what the app is: a day's spine with entries hanging off it, the
    nodes in the same three kind colours the rows use.
    Drawn on a 24-unit grid from a handful of rounded primitives, because the
    same geometry has to survive as a flat white silhouette at 24px — that is
    the Android notification icon, and anything finer disappears there. The
    Android vector drawables carry these exact paths.
    The spine has square ends on purpose: the top and bottom nodes cover them.
  -->
  <rect width="24" height="24" rx="5.4" fill="#111827" />

  <path d="M6.2,5 H7.8 V19 H6.2 Z" fill="#e8eaf0" />

  <path d="M4.8,7 A2.2,2.2 0 1 0 9.2,7 A2.2,2.2 0 1 0 4.8,7 Z" fill="#ff8f7a" />
  <path d="M12,6 L18,6 A1,1 0 0 1 18,8 L12,8 A1,1 0 0 1 12,6 Z" fill="#e8eaf0" />

  <path d="M4.8,12 A2.2,2.2 0 1 0 9.2,12 A2.2,2.2 0 1 0 4.8,12 Z" fill="#3ec5b9" />
  <path d="M12,11 L15.5,11 A1,1 0 0 1 15.5,13 L12,13 A1,1 0 0 1 12,11 Z" fill="#e8eaf0" />

  <path d="M4.8,17 A2.2,2.2 0 1 0 9.2,17 A2.2,2.2 0 1 0 4.8,17 Z" fill="#a78bfa" />
  <path d="M12,16 L19,16 A1,1 0 0 1 19,18 L12,18 A1,1 0 0 1 12,16 Z" fill="#e8eaf0" />
</svg>
