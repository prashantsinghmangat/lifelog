# Spec 040. Netlify stays the deployer; this only refuses to stay green when
# the gate would have failed. The two VITE_ secrets must be set or the build
# step fails loudly — a budget measured without them is a lie (PROJECT §7).
name: ci

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  gate:
    runs-on: ubuntu-latest
    # The suite's fixtures carry +05:30 stamps and assert local clock readings:
    # 28 tests fail under UTC (measured 2 Oct 2026). Pinned to the timezone the
    # suite is verified in, until the fixtures are made timezone-agnostic.
    env:
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc -b
      - run: npx vitest run
      - name: refuse to measure the budget against a lie
        run: test -n "$VITE_SUPABASE_URL" && test -n "$VITE_SUPABASE_ANON_KEY"
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
