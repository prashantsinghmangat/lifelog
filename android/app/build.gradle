apply plugin: 'com.android.application'

/**
 * Release signing, supplied from outside the repository.
 *
 * Nothing about a keystore may ever be committed — not the file, not the
 * passwords, not an alias in a properties file somebody will forget is there.
 * The project already has one convention for this and it is environment
 * variables: `CAP_DEV_URL` drives the dev server the same way, `VITE_*` reach
 * the bundle, and `BACKUP_TOKEN` / `SUPABASE_SERVICE_ROLE_KEY` live in the
 * Netlify site environment. `scripts/gradle.mjs` forwards `process.env`, so the
 * same four variables work from a local shell and from CI with no second
 * mechanism to keep in step.
 *
 *   LIFELOG_KEYSTORE           absolute path to the .jks / .keystore
 *   LIFELOG_KEYSTORE_PASSWORD
 *   LIFELOG_KEY_ALIAS
 *   LIFELOG_KEY_PASSWORD
 *
 * Absent, the release build *fails* rather than producing something. See the
 * guard at the foot of this file: an unsigned APK is the one output that looks
 * like a successful release and cannot be installed or uploaded.
 */
def signingEnv = [
    store        : System.getenv('LIFELOG_KEYSTORE'),
    storePassword: System.getenv('LIFELOG_KEYSTORE_PASSWORD'),
    alias        : System.getenv('LIFELOG_KEY_ALIAS'),
    keyPassword  : System.getenv('LIFELOG_KEY_PASSWORD'),
]
def canSignRelease = signingEnv.values().every { it != null && !it.trim().isEmpty() }

android {
    namespace = "com.prashant.lifelog"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.prashant.lifelog"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // The committed values are the first release's. Overridable from the
        // environment so a second release does not require editing a tracked
        // file — Play refuses any upload whose versionCode does not exceed the
        // last, and nothing here increments it on its own.
        versionCode Integer.parseInt(System.getenv('LIFELOG_VERSION_CODE') ?: '1')
        versionName System.getenv('LIFELOG_VERSION_NAME') ?: '1.0'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (canSignRelease) {
            release {
                storeFile file(signingEnv.store)
                storePassword signingEnv.storePassword
                keyAlias signingEnv.alias
                keyPassword signingEnv.keyPassword
            }
        }
    }

    buildTypes {
        release {
            // Stated rather than inherited. It is already the default, and it is
            // the single flag that decides whether anything with ADB access can
            // attach to the WebView and read `localStorage` — which here holds
            // the whole log and a live Supabase refresh token.
            debuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (canSignRelease) {
                signingConfig signingConfigs.release
            }
        }
    }
}

/**
 * No credentials, no release artifact.
 *
 * Without this, `assembleRelease` succeeds and writes `app-release-unsigned.apk`
 * — a file that cannot be installed or uploaded, produced by a build that said
 * BUILD SUCCESSFUL. That is the same shape of failure this project rejects
 * everywhere else: a thing that silently does not do what it says.
 *
 * Attached to the packaging tasks rather than to `assembleRelease`, which runs
 * after them, and only to the release variant, so the debug workflow is
 * untouched.
 */
if (!canSignRelease) {
    tasks.configureEach { task ->
        if (task.name == 'packageRelease' || task.name == 'packageReleaseBundle') {
            task.doFirst {
                throw new GradleException(
                    '''
                    |Release signing is not configured, so this build would produce an
                    |unsigned APK: a file that cannot be installed or uploaded, written by
                    |a build that said BUILD SUCCESSFUL.
                    |
                    |Set all four, then run the build again:
                    |  LIFELOG_KEYSTORE           absolute path to the .jks / .keystore
                    |  LIFELOG_KEYSTORE_PASSWORD
                    |  LIFELOG_KEY_ALIAS
                    |  LIFELOG_KEY_PASSWORD
                    |
                    |Never commit the keystore or any of these values.
                    |For a local build use assembleDebug, which needs none of them.
                    '''.stripMargin()
                )
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
